<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상의학과 업무일지</title>
  <style>
    /* ── 공통 (base.html 동일) ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      background: #f0f2f5;
      color: #333;
      font-size: 14px
    }

    a {
      text-decoration: none;
      color: inherit
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 8px 12px;
      border-bottom: 1px solid #e0e0e0;
      text-align: left;
      vertical-align: middle
    }

    th {
      background: #f8f9fa;
      font-weight: 600;
      color: #555
    }

    tr:hover {
      background: #fafbfc
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit
    }

    textarea {
      resize: vertical;
      min-height: 80px
    }

    button,
    .btn {
      padding: 7px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500
    }

    .btn-primary {
      background: #1a73e8;
      color: #fff
    }

    .btn-primary:hover {
      background: #1558b0
    }

    .btn-success {
      background: #34a853;
      color: #fff
    }

    .btn-danger {
      background: #ea4335;
      color: #fff
    }

    .btn-warning {
      background: #fbbc04;
      color: #333
    }

    .btn-secondary {
      background: #6c757d;
      color: #fff
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #555
    }

    .form-group {
      margin-bottom: 14px
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
      padding: 20px;
      margin-bottom: 16px
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1a73e8;
      border-bottom: 2px solid #1a73e8;
      padding-bottom: 6px
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600
    }

    .badge-danger {
      background: #fdecea;
      color: #c62828
    }

    .badge-warning {
      background: #fff8e1;
      color: #f57f17
    }

    .badge-success {
      background: #e8f5e9;
      color: #2e7d32
    }

    .badge-info {
      background: #e3f2fd;
      color: #1565c0
    }

    .badge-secondary {
      background: #f5f5f5;
      color: #555
    }

    .alert {
      padding: 10px 16px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9
    }

    .alert-danger {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ffcdd2
    }

    .alert-info {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #bbdefb
    }

    .text-muted {
      color: #888;
      font-size: 12px
    }

    .text-right {
      text-align: right
    }

    .mt-2 {
      margin-top: 8px
    }

    .mb-2 {
      margin-bottom: 8px
    }

    .flex {
      display: flex
    }

    .flex-wrap {
      flex-wrap: wrap
    }

    .align-center {
      align-items: center
    }

    .justify-between {
      justify-content: space-between
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    /* ── 사이드바 ── */
    :root {
      --sidebar-width: 215px;
      --sidebar-collapsed: 56px;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: #1e2a3a;
      color: #fff;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1)
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed)
    }

    .sidebar-header {
      padding: 16px 14px 14px;
      background: #0d2440;
      border-bottom: 1px solid #1c385c;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      white-space: nowrap;
      position: relative;
    }
    .sidebar-header .header-text {
      opacity: 1;
      transition: opacity 0.2s;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header .hosp-name {
      color: #ffffff;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.3px;
      line-height: 1.2;
      opacity: 0.9;
    }
    .sidebar-header .dept-title {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.3;
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .sidebar-header .cau-logo-wrap {
      display: flex;
      align-items: center;
      margin-top: 2px;
    }
    .sidebar-header .header-collapsed-icon {
      display: none;
    }
    .sidebar.collapsed .sidebar-header {
      padding: 12px 0;
      justify-content: center;
    }
    .sidebar.collapsed .header-text {
      display: none;
      opacity: 0;
      pointer-events: none;
    }
    .sidebar.collapsed .header-collapsed-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      color: #b0bec5;
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: .2s;
      white-space: nowrap
    }

    .sidebar nav a span {
      opacity: 1;
      transition: opacity 0.2s
    }

    .sidebar.collapsed nav a span {
      opacity: 0;
      pointer-events: none
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: #2a3f55;
      color: #fff;
      border-left-color: #1a73e8
    }

    .sidebar nav .nav-section {
      padding: 8px 16px 4px;
      font-size: 10px;
      color: #546e7a;
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-top: 4px;
      white-space: nowrap
    }

    .sidebar nav .nav-section span {
      opacity: 1;
      transition: opacity 0.2s
    }

    .sidebar.collapsed .nav-section span {
      opacity: 0;
      pointer-events: none
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid #2a3f55;
      font-size: 12px;
      color: #78909c;
      white-space: nowrap
    }

    .sidebar-footer .footer-text {
      opacity: 1;
      transition: opacity 0.2s
    }

    .sidebar.collapsed .footer-text {
      opacity: 0;
      pointer-events: none
    }

    /* ── 메인 ── */
    .main {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1)
    }

    .sidebar.collapsed + .main {
      margin-left: var(--sidebar-collapsed)
    }

    .topbar {
      background: #fff;
      padding: 12px 24px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 12px
    }

    #sidebar-toggle {
      background: #e8f0fe;
      border: none;
      color: #1a73e8;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s
    }

    #sidebar-toggle:hover {
      background: #1a73e8;
      color: #fff
    }

    @media (max-width: 768px) {
      .sidebar {
        left: calc(-1 * var(--sidebar-width));
        width: var(--sidebar-width);
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1)
      }

      .sidebar.active {
        left: 0
      }

      .sidebar.collapsed {
        width: var(--sidebar-width)
      }

      .sidebar nav a span,
      .sidebar.collapsed nav a span,
      .sidebar-header .header-text,
      .sidebar.collapsed .header-text,
      .sidebar-footer .footer-text,
      .sidebar.collapsed .footer-text {
        opacity: 1;
        pointer-events: auto
      }

      .main,
      .sidebar.collapsed + .main {
        margin-left: 0
      }
    }

    .topbar .page-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e2a3a
    }

    .content {
      padding: 20px 24px 60px
    }

    /* ── KPI 카드 ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 20px
    }

    .stat-card {
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
      border-left: 4px solid #1a73e8;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: visible
    }

    .stat-card .num {
      font-size: 28px;
      font-weight: 700;
      color: #1a73e8
    }

    .stat-card .lbl {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
      cursor: default
    }

    .stat-card.red {
      border-left-color: #ea4335
    }

    .stat-card.red .num {
      color: #ea4335
    }

    .stat-card.green {
      border-left-color: #34a853
    }

    .stat-card.green .num {
      color: #34a853
    }

    .stat-card.yellow {
      border-left-color: #fbbc04
    }

    .stat-card.yellow .num {
      color: #f57f17
    }

    .stat-card.purple {
      border-left-color: #9c27b0
    }

    .stat-card.purple .num {
      color: #9c27b0
    }

    .stat-card.teal {
      border-left-color: #009688
    }

    .stat-card.teal .num {
      color: #009688
    }

    /* KPI 툴팁 */
    .kpi-tooltip {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .15);
      padding: 12px 14px;
      z-index: 200;
      min-width: 260px;
      max-width: 400px;
      font-size: 12px;
      text-align: left;
      pointer-events: none;
      white-space: normal
    }

    .kpi-tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-bottom-color: #ddd;
      border-top: none
    }

    .kpi-tooltip::after {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-bottom-color: #fff;
      border-top: none
    }

    .stat-card:hover .kpi-tooltip {
      display: block
    }

    .kpi-tooltip .tt-title {
      font-weight: 700;
      color: #1e2a3a;
      margin-bottom: 8px;
      font-size: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px
    }

    .kpi-tooltip table {
      width: 100%;
      border-collapse: collapse
    }

    .kpi-tooltip td {
      padding: 3px 5px;
      vertical-align: top;
      border-bottom: 1px solid #f5f5f5
    }

    .kpi-tooltip tr:last-child td {
      border-bottom: none
    }

    .kpi-tooltip .empty-msg {
      color: #aaa;
      font-style: italic
    }

    /* ── 대시보드 ── */
    .shift-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600
    }

    .shift-오전 {
      background: #e3f2fd;
      color: #1565c0
    }

    .shift-종일 {
      background: #e8f5e9;
      color: #2e7d32
    }

    .shift-야간 {
      background: #fce4ec;
      color: #c62828
    }

    .dash-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px
    }

    /* ── 테이블 래퍼 ── */
    .table-wrap {
      overflow-x: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1)
    }

    .table-wrap table {
      margin: 0
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e0e0e0
    }

    .table-header h2 {
      font-size: 15px;
      font-weight: 700
    }

    /* ── 업무일지 리스트 ── */
    .log-table th,
    .log-table td {
      text-align: center
    }

    .log-table td:first-child {
      text-align: left;
      font-weight: 600
    }

    .log-table td:last-child {
      text-align: center;
      white-space: nowrap
    }

    .dot {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 11px;
      line-height: 22px;
      font-weight: 700
    }

    .dot.filled {
      background: #1a73e8;
      color: #fff
    }

    .dot.empty {
      background: #eee;
      color: #aaa
    }

    .badge-submitted {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600
    }

    .badge-rejected {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ffcdd2;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600
    }

    /* ── 작성 페이지 ── */
    .date-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: #fff;
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1)
    }

    .date-bar input[type=date] {
      width: 180px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid #1a73e8;
      border-radius: 6px;
      padding: 6px 10px;
      color: #1e2a3a
    }

    .acc {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
      margin-bottom: 10px;
      overflow: hidden
    }

    .acc-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      user-select: none;
      border-left: 4px solid #1a73e8;
      font-weight: 700;
      font-size: 14px;
      background: #fff
    }

    .acc-head:hover {
      background: #f5f8ff
    }

    .acc-head .cnt {
      font-size: 12px;
      color: #888;
      font-weight: 400;
      margin-left: 6px
    }

    .acc-head .toggle {
      font-size: 18px;
      color: #aaa;
      transition: .2s
    }

    .acc-body {
      display: block;
      padding: 0 18px 16px;
      border-top: 1px solid #f0f0f0
    }

    .add-form {
      background: #f8f9fb;
      border-radius: 6px;
      padding: 14px;
      margin-top: 10px;
      border: 1px dashed #ccc
    }

    .add-form .form-row {
      display: grid;
      gap: 8px;
      margin-bottom: 8px
    }

    .add-form .form-row.col2 {
      grid-template-columns: 1fr 1fr
    }

    .add-form .form-row.col3 {
      grid-template-columns: 1fr 1fr 1fr
    }

    .add-form .form-row.col4 {
      grid-template-columns: 1fr 1fr 1fr 1fr
    }

    .add-form label {
      font-size: 12px;
      margin-bottom: 2px;
      color: #555
    }

    .edit-form {
      background: #fffde7;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 4px;
      border: 1px solid #f9a825;
      display: none
    }

    .edit-form .form-row {
      display: grid;
      gap: 8px;
      margin-bottom: 8px
    }

    .edit-form .form-row.col2 {
      grid-template-columns: 1fr 1fr
    }

    .edit-form .form-row.col3 {
      grid-template-columns: 1fr 1fr 1fr
    }

    .edit-form .form-row.col4 {
      grid-template-columns: 1fr 1fr 1fr 1fr
    }

    .edit-form label {
      font-size: 12px;
      margin-bottom: 2px;
      color: #555
    }

    .entry-list {
      margin-top: 10px
    }

    .entry-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 4px;
      background: #fafafa;
      border: 1px solid #eee;
      margin-bottom: 4px;
      font-size: 13px;
      gap: 8px
    }

    .entry-row .info {
      flex: 1;
      min-width: 0
    }

    .entry-row .btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0
    }

    .acc-head.roster-h {
      border-left-color: #5c6bc0
    }

    .acc-head.vacation-h {
      border-left-color: #26a69a
    }

    .acc-head.oncall-h {
      border-left-color: #1a73e8
    }

    .acc-head.overtime-h {
      border-left-color: #f57c00
    }

    .acc-head.equip-h {
      border-left-color: #e53935
    }

    .acc-head.handover-h {
      border-left-color: #43a047
    }

    .acc-head.issue-h {
      border-left-color: #8e24aa
    }

    /* ── 반려 모달 ── */
    #rejectModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .5);
      z-index: 9999;
      justify-content: center;
      align-items: center
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 28px;
      min-width: 340px;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2)
    }

    .modal-box h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: #1e2a3a
    }

    .modal-box .modal-date {
      color: #555;
      font-size: 13px;
      margin-bottom: 18px
    }

    .modal-box label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px
    }

    .modal-box select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px
    }

    /* ── 인쇄 ── */
    .print-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px
    }

    .print-header-tbl {
      width: 100%;
      border-collapse: collapse;
      border-bottom: 2px solid #000;
      margin-bottom: 16px
    }

    .print-header-tbl td {
      border: none;
      padding: 0 0 12px 0;
      vertical-align: middle
    }

    .print-header-title h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px
    }

    .print-header-title .sub {
      font-size: 12px;
      color: #444;
      margin-top: 6px
    }

    .approval-box {
      border-collapse: collapse;
      font-size: 11px;
      float: right;
      width: 192px;
      table-layout: fixed
    }

    .approval-box th,
    .approval-box td {
      border: 1px solid #000;
      text-align: center;
      padding: 0;
      width: 64px
    }

    .approval-box th {
      font-weight: 600;
      height: 24px;
      padding: 2px 4px;
      background: #fff
    }

    .approval-box td {
      height: 50px
    }

    .psection {
      margin-bottom: 16px
    }

    .psection-title {
      font-size: 13px;
      font-weight: 700;
      background: #1e2a3a;
      color: #fff;
      padding: 5px 10px;
      border-radius: 3px;
      margin-bottom: 6px
    }

    .psection table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px
    }

    .psection th,
    .psection td {
      border: 1px solid #ccc;
      padding: 5px 8px;
      text-align: left;
      vertical-align: middle
    }

    .psection th {
      background: #f0f0f0;
      font-weight: 600;
      white-space: nowrap
    }

    .empty-msg {
      color: #aaa;
      font-style: italic;
      padding: 6px 0;
      font-size: 11px
    }

    .print-footer {
      margin-top: 20px;
      border-top: 1px solid #ccc;
      padding-top: 8px;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between
    }

    @media print {

      .sidebar,
      .topbar,
      .no-print {
        display: none !important
      }

      .main {
        margin-left: 0
      }

      @page {
        margin: 15mm;
        size: A4
      }
    }

    /* ── 로그인 ── */
    #login-page {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1e2a3a
    }

    .login-box {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 360px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3)
    }

    .login-box .logo {
      text-align: center;
      margin-bottom: 28px
    }

    .login-box .logo .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px
    }

    .login-box .logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1e2a3a
    }

    .login-box .logo p {
      font-size: 12px;
      color: #888;
      margin-top: 4px
    }

    .login-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 14px
    }

    .login-box input:focus {
      outline: none;
      border-color: #1a73e8
    }

    .login-box button {
      width: 100%;
      padding: 11px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer
    }

    .login-box button:hover {
      background: #1558b0
    }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 11px;
      color: #aaa
    }

    /* ── 사용자 관리 ── */
    .form-container {
      max-width: 700px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
      padding: 24px
    }

    .form-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #1a73e8;
      color: #1e2a3a
    }
  </style>
</head>

    <div class="main">
      <div class="topbar">
        <button id="sidebar-toggle" title="메뉴 토글">☰</button>
        <div class="page-title" id="page-title"></div>
        <div class="text-muted" id="topbar-clock"></div>
      </div>
      <div class="content" id="content"></div>

  <!-- ═══════════ 반려 모달 ═══════════ -->
  <div id="rejectModal">
    <div class="modal-box">
      <h3>업무일지 반려</h3>
      <p class="modal-date" id="rejectModalDate"></p>
      <label>반려 대상 사용자 선택</label>
      <select id="rejectUserSelect"></select>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeRejectModal()">취소</button>
        <button class="btn btn-warning" onclick="confirmReject()">반려 확인</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ── 전역 상태 ──
    let ME = null; // {user, name, role}
    let _rejectDate = '';
    let _writeDate = '';

    // ── API 헬퍼 ──
    async function api(path, body = null) {
      try {
        const opts = { credentials: 'include' };
        if (body !== null) {
          opts.method = 'POST';
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify(body);
        }
        const r = await fetch(path, opts);
        return r.json();
      } catch (e) {
        return { ok: false, msg: '서버에 연결할 수 없습니다. 서버가 실행 중인지 확인하고\nhttp://서버IP:1000/app 으로 접속하세요.\n(' + e.message + ')' };
      }
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── 시계 ──
    setInterval(() => {
      const el = document.getElementById('topbar-clock');
      if (el) el.textContent = new Date().toLocaleString('ko-KR');
    }, 1000);

    // ── 로그인 / 로그아웃 ──
    async function doLogin() {
      const username = document.getElementById('inp-user').value.trim();
      const password = document.getElementById('inp-pw').value;
      const r = await api('/api/login', { username, password });
      if (r.ok) {
        ME = r;
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app-page').style.display = '';
        document.getElementById('sf-name').textContent = r.name;
        document.getElementById('sf-role').textContent = r.role === 'admin' ? '관리자' : '사용자';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = r.role === 'admin' ? '' : 'none');
        nav('dashboard');
      } else {
        const el = document.getElementById('login-alert');
        el.textContent = r.msg || '로그인 실패';
        el.style.display = '';
      }
    }

    async function doLogout() {
      await api('/api/logout', {});
      ME = null;
      document.getElementById('app-page').style.display = 'none';
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('inp-pw').value = '';
      document.getElementById('login-alert').style.display = 'none';
    }

    // ── 네비게이션 ──
    const pageTitles = { dashboard: '📊 대시보드', write: '✏️ 작성', worklog: '📋 업무일지 리스트', users: '👥 사용자 관리', print: '🖨️ 인쇄' };

    function nav(page, params = {}) {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
      document.getElementById('page-title').textContent = pageTitles[page] || page;
      document.getElementById('content').innerHTML = '<p style="padding:20px;color:#888">로딩 중...</p>';
      if (page === 'dashboard') renderDashboard();
      else if (page === 'write') renderWrite(params.date);
      else if (page === 'worklog') renderWorklog();
      else if (page === 'users') renderUsers();
      else if (page === 'print') renderPrint(params.date);
    }

    document.querySelectorAll('[data-page]').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); nav(a.dataset.page); });
    });

    // ── 공통: 아코디언 토글 ──
    function toggle(head) {
      const body = head.nextElementSibling;
      const arrow = head.querySelector('.toggle');
      const isOpen = body.style.display !== 'none';
      body.style.display = isOpen ? 'none' : 'block';
      arrow.textContent = isOpen ? '▼' : '▲';
    }

    // ═══════════════════════════════════════════════════
    // 대시보드
    // ═══════════════════════════════════════════════════
    async function renderDashboard() {
      const d = await api('/api/dashboard');
      if (!d.ok) return;

      function badge(text, cls) { return `<span class="badge ${cls}">${esc(text)}</span>`; }
      function sev(s) { return s === '긴급' ? 'badge-danger' : s === '중요' ? 'badge-warning' : 'badge-secondary'; }

      function kpiTooltip(title, rows, colFn) {
        const rowsHtml = rows.length
          ? rows.map(r => `<tr>${colFn(r)}</tr>`).join('')
          : '<tr><td colspan="3" class="empty-msg">없음</td></tr>';
        return `<div class="kpi-tooltip"><div class="tt-title">${title} (${rows.length}건)</div><table>${rowsHtml}</table></div>`;
      }

      const kpis = [
        {
          cls: 'red', num: d.issues_open.length, lbl: '⚠️ 미해결 이슈',
          tip: kpiTooltip('⚠️ 미해결 이슈', d.issues_open, r => `<td>${badge(r.severity, sev(r.severity))}</td><td style="font-weight:600">${esc(r.title)}</td><td style="color:#888">${esc(r.date)}</td>`)
        },
        {
          cls: '', num: d.issues_today.length, lbl: '📋 오늘 이슈', style: 'border-left-color:#1a73e8',
          tip: kpiTooltip('📋 오늘 이슈', d.issues_today, r => `<td>${badge(r.severity, sev(r.severity))}</td><td style="font-weight:600">${esc(r.title)}</td><td style="color:#888">${esc(r.category)}</td>`)
        },
        {
          cls: 'green', num: d.handover_today.length, lbl: '🔄 오늘 인수인계',
          tip: kpiTooltip('🔄 오늘 인수인계', d.handover_today, r => `<td>${badge(r.priority, sev(r.priority))}</td><td>${esc(r.from_person)}→${esc(r.to_person)}</td><td style="color:#555">${esc((r.content || '').slice(0, 25))}</td>`)
        },
        {
          cls: 'yellow', num: d.equip_active.length, lbl: '🔧 장비 처리중',
          tip: kpiTooltip('🔧 처리중인 장비', d.equip_active, r => `<td style="font-weight:600">${esc(r.equipment)}</td><td>${badge(r.log_type, 'badge-warning')}</td><td style="color:#555">${esc((r.description || '').slice(0, 25))}</td>`)
        },
        {
          cls: 'purple', num: d.vacation_today.length, lbl: '🌴 오늘 휴가',
          tip: kpiTooltip('🌴 오늘 휴가', d.vacation_today, r => `<td style="font-weight:600">${esc(r.staff_name)}</td><td>${badge(r.vacation_type, 'badge-info')}</td><td style="color:#888">${esc(r.start_date)}</td>`)
        },
        {
          cls: 'teal', num: d.oncall_today.length, lbl: '📱 오늘 On-call',
          tip: kpiTooltip('📱 오늘 On-call', d.oncall_today, r => `<td>${badge(r.modality, 'badge-info')}</td><td style="font-weight:600">${esc(r.staff_name)}</td><td style="color:#888">${r.start_time ? esc(r.start_time) + '~' + esc(r.end_time) : '-'}</td>`)
        },
      ];

      const kpiHtml = kpis.map(k => `
    <div class="stat-card ${k.cls}" ${k.style ? `style="${k.style}"` : ''}">
      <div class="num" ${k.style ? `style="color:#1a73e8"` : ''}>${k.num}</div>
      <div class="lbl">${k.lbl}</div>
      ${k.tip}
    </div>`).join('');

      const td = d.today;

      function dashCard(title, content) {
        return `<div class="card"><div class="card-title">${title}</div>${content}<div class="mt-2"><a href="#" onclick="nav('write',{date:'${td}'});return false" class="btn btn-sm btn-primary">+ 등록</a></div></div>`;
      }

        document.getElementById('sf-name').textContent = r.name;
        document.getElementById('sf-role').textContent = r.role === 'admin' ? '관리자' : '사용자';
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = r.role === 'admin' ? '' : 'none');
        nav('dashboard');
      } else if (!r.ok && r.msg && r.msg.includes('연결')) {
        const el = document.getElementById('login-alert');
        el.textContent = r.msg;
        el.style.display = '';
      }
    })();
  </script>
</body>

</html>
